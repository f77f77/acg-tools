name: Update season.json

on:
  schedule:
    # 每日 00:15 香港時間（UTC 16:15）
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Bangumi calendar
        run: python3 scripts/update_season.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add season.json
          if git diff --staged --quiet; then
            echo "season.json unchanged"
          else
            git commit -m "chore: auto-update season.json from Bangumi"
            git push
          fi
