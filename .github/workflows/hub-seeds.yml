name: Validate hub seed JSON

# Schema checks only. They do not fetch Mystery Gift codes or subtitle platforms.
# data/anime-subs.json is the 中文字幕 overlay merged into 新番表 (route #anime → #season/zh).
# data/codes.json gamesCatalog includes 寶可夢 Champions even when that game has no rows.
on:
  workflow_dispatch:
  schedule:
    # Monday 00:30 HKT = Sunday 16:30 UTC
    - cron: "30 16 * * 0"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Codes schema
        run: python3 scripts/refresh_codes_stub.py
      - name: Anime subtitle schema
        run: python3 scripts/refresh_anime_stub.py
