name: Validate hub seed JSON

# Schema checks only. They do not fetch Mystery Gift codes.
# data/anime-subs.json is the 中文字幕 overlay (route #anime → #season/zh),
# written by scripts/sync_anime_subs.py. This job also runs that mapper
# offline against a fixture so the Notion → JSON path stays tested without secrets.
# The subscription job encrypts a fake fixture and decrypts it with Node WebCrypto.
# data/events.json is events.v2, written by scripts/sync_events.py. This job
# validates the committed file and runs the mapper offline against a fixture.
# data/codes.json gamesCatalog includes 寶可夢 Champions even when that game has no rows.
on:
  workflow_dispatch:
  schedule:
    # Monday 00:30 HKT = Sunday 16:30 UTC
    - cron: "30 16 * * 0"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Codes schema
        run: python3 scripts/refresh_codes_stub.py
      - name: Anime subtitle schema
        run: python3 scripts/refresh_anime_stub.py
      - name: Anime subtitle fixture
        run: |
          python3 scripts/sync_anime_subs.py \
            --fixture scripts/fixtures/notion_query_sample.json \
            --season scripts/fixtures/season_sample.json \
            --offline --check \
            --out /tmp/anime-subs-fixture.json \
            --cache /tmp/anime-bgm-cache-fixture.json
      - name: Events schema and fixture
        run: |
          python3 scripts/sync_events.py --validate
          python3 scripts/sync_events.py \
            --fixture scripts/fixtures/notion_events_sample.json \
            --offline --check \
            --out /tmp/events-fixture.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Subscription fixture round-trip
        env:
          SUBS_PASSPHRASE: demo-subs
        run: |
          python3 -m venv "$RUNNER_TEMP/subs-venv"
          "$RUNNER_TEMP/subs-venv/bin/pip" install --disable-pip-version-check cryptography
          "$RUNNER_TEMP/subs-venv/bin/python" scripts/sync_subscriptions.py \
            --fixture scripts/fixtures/notion_subs_sample.json \
            --roundtrip \
            --out /tmp/subscriptions.enc.json
