name: Sync Hong Kong events

# Notion「香港ACG情報看板」→ data/events.json events[].
# deadlines[] stay in the file; sample/example rows are dropped by the script.
# A push to main retriggers pages.yml via workflow_run.
# Missing NOTION_TOKEN exits 0 and leaves the JSON untouched (forks / PR CI).
on:
  schedule:
    # 每日 07:19 香港時間（UTC 23:19）
    - cron: "19 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Notion 香港活動
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_EVENTS_DB_ID: ${{ secrets.NOTION_EVENTS_DB_ID }}
        run: python3 scripts/sync_events.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --staged --quiet; then
            echo "events unchanged"
          else
            git commit -m "chore: sync events from Notion"
            git push
          fi
