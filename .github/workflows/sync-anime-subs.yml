name: Sync anime subtitle table

# Notion「中文字幕動畫播放表」→ data/anime-subs.json.
# Runs after the 00:15 HKT season.json update. A push to main retriggers pages.yml.
# Missing NOTION_TOKEN exits 0 and leaves the JSON untouched (forks / PR CI).
on:
  schedule:
    # 每日 06:17 香港時間（UTC 22:17）
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Notion 中文字幕
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ANIME_DB_ID: ${{ secrets.NOTION_ANIME_DB_ID }}
        run: python3 scripts/sync_anime_subs.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anime-subs.json data/anime-bgm-cache.json
          if git diff --staged --quiet; then
            echo "anime subs unchanged"
          else
            git commit -m "chore: sync anime-subs.json from Notion"
            git push
          fi
