name: Sync subscriptions

# Notion「訂閱追蹤」→ data/subscriptions.enc.json (PBKDF2 + AES-GCM).
# A push to main does not retrigger pages.yml when made with GITHUB_TOKEN;
# pages.yml lists this workflow under workflow_run.
# Missing NOTION_TOKEN or SUBS_PASSPHRASE exits 0 and leaves the file untouched.
# The script logs counts only and never writes subscription plaintext.
on:
  schedule:
    # 每日 06:43 香港時間（UTC 22:43）
    - cron: "43 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Notion 訂閱追蹤
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUBS_PASSPHRASE: ${{ secrets.SUBS_PASSPHRASE }}
          NOTION_SUBS_DB_ID: ${{ secrets.NOTION_SUBS_DB_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/subs-venv"
          "$RUNNER_TEMP/subs-venv/bin/pip" install --disable-pip-version-check cryptography
          "$RUNNER_TEMP/subs-venv/bin/python" scripts/sync_subscriptions.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f data/subscriptions.enc.json ]]; then
            git add -- data/subscriptions.enc.json
          fi
          if git diff --staged --quiet; then
            echo "subscriptions unchanged"
          else
            git commit -m "chore: sync encrypted subscriptions"
            git push
          fi
